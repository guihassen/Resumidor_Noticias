name: Resumidor Diario de Noticias
on:
  schedule:
    # Horários em UTC. Brasília = UTC-3 → somar 3h ao horário local desejado.
    - cron: "0 13 * * *" # 10:00 BRT
    - cron: "0 16 * * *" # 16:00 BRT
    - cron: "0 21 * * *" # 20:00 BRT
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
      - name: Executar Script
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CARTEIRA: ${{ secrets.CARTEIRA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Postgres privado (histórico/gráfico de evolução)
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }} # opcional: cotações via brapi.dev
        run: python main.py
